# 仅供探索节点读取；组合进程中的在线层析图使用独立参数。
/legbot_explorer:
  # 固定键名；下面缩进四格的项目才是真正的参数。
  ros__parameters:
    frame_id: map                         # 统一地图坐标系；里程计和点云必须与它一致。
    cloud_topic: /slam/global_cloud_registered # 每帧已配准到地图坐标系的点云；本包负责长期累计。
    sensor_odom_topic: /slam/odometry_lidar # 雷达位姿输入，用于确定每条射线从哪里发出。
    base_odom_topic: /slam/global_odometry_base # 机体位姿输入，用于确定机器人所在位置和高度。
    planner_occupancy_topic: /local_planner/grid_map/occupancy_inflate # SCAN 膨胀后的障碍点云。
    waypoint_topic: /scan/waypoint_request   # 探索器把新目标发到这里。
    scan_goal_topic: /scan/goal            # SCAN 转发目标后，探索器从这里确认。
    ready_topic: /go2/demo_ready           # GO2 控制器就绪信号。
    resolution: 0.25                       # 每个体素边长，单位米；越小越精细、越占内存。
    max_ray_range: 9.0                     # 超过此距离的雷达点不纳入地图，单位米。
    point_stride: 8                        # 每 8 个点取 1 个，降低处理量。
    max_points_per_cloud: 1000             # 每帧最多使用 1000 个抽样点。
    max_voxels: 900000                     # 稀疏地图最多保存的体素数量。
    sensor_sync_tolerance: 0.03            # 点云和里程计允许相差的最大时间，单位秒。
    odom_timeout: 1.0                      # 机体位姿超过 1 秒未更新时停止选新目标。
    cloud_timeout: 2.0                     # 地图点云超过 2 秒未更新时停止选新目标。
    obstacle_min_relative_z: -0.15        # 相对机体高度的障碍判定下界，单位米。
    obstacle_max_relative_z: 0.85         # 相对机体高度的障碍判定上界，单位米。
    free_min_relative_z: -0.45            # 二维投影纳入的最低高度，单位米。
    planner_occupancy_radius: 0.0        # SCAN 输入障碍图已膨胀半径；0 保持独立启动时的旧行为。
    planner_occupancy_resolution: 0.10   # SCAN 障碍格边长；须与 scan.yaml 一致。
    local_search_radius: 10.0             # 局部搜索时的半径，单位米。
    pct_local_height_above: 3.5            # 三维选点窗口：相对当前支撑表面向上的米数。
    pct_local_height_below: 1.5            # 向下高度；水平为±local_search_radius，不裁剪规划图。
    pct_direction_weight: 0.5             # PCT目标方向变化的软惩罚，0关闭。
    cross_layer_enabled: true
    pct_floor_exploration: true          # 当前层收尾后跨层，以连通实测平台确认新层 G。
    skip_start_floor_exploration: false  # 跨层测试。共用普通探索识别楼梯，确认可上行后提前结束起始层；新层正常探索。
    pct_floor_height_tolerance: 0.08     # 同层前沿的优先高度带半宽，也是上升簇切换跨层的实测升高阈值，单位米。
    pct_foot_contact_force: 12.0        # 用于判定足端接地的受力，单位牛顿。
    cross_layer_height_slack: 0.05        # 上行进度允许的高度误差，单位米。
    cross_layer_corridor_radius: 1.5      # 后续观察位置与当前路线方向的侧向范围，单位米。
    global_search: true                   # 二维选点范围；PCT独立采用三维局部优先、全局后备。
    frontier_source: pct                 # occupancy / pct；PCT 选点要求同进程在线 PCT，第一阶段只交给层析规划。
    planner_mode: layer                  # both / occupancy / layer；脱困沿用同一规划器选择。
    layer_surface_timeout: 2.5           # 共享 PCT 超过此时间未刷新时不可用；仅双规划可选二维结果。
    recovery_goal_xy_tolerance: 0.15    # 脱困最终位置目标的水平到达容差；普通探索不指定，沿用 SCAN 默认。
    bounds_relative_to_start: false       # true 时把边界坐标加到起始机体位置上。
    exploration_min_x: -31.5              # 全图搜索区域的最小 X，单位米。
    exploration_max_x: 31.5               # 覆盖 Building 场景的东侧建筑区域，单位米。
    exploration_min_y: -15.5              # 全图搜索区域的最小 Y，单位米。
    exploration_max_y: 15.5               # 全图搜索区域的最大 Y，单位米。
    min_frontier_cells: 3                 # 仅二维占据图；PCT 普通层探索允许单格簇。
    frontier_gain_weight: 1.0             # 簇规模收益在评分中的权重。
    path_cost_weight: 1.0                 # 路径代价在评分中的权重。
    unknown_path_multiplier: 1.5         # 仅前沿终点未知格的评分成本倍率；中间路径不走未知格。
    free_observation_saturation: 3       # 同一格被多少帧空闲射线穿过后视作观测充分；每帧最多记一次。
    low_evidence_cost_weight: 0.7        # 只有一帧空闲观测时二维 A* 的额外代价；三帧后不再加罚。
    shortcut_cost_tolerance: 0.05       # 二维路线简化后允许的最大观测代价增幅比例。
    goal_reach_xy: 0.55                   # 校验 SCAN 停车回执位置及过滤首次下发前的近距离路点。
    observation_min_distance: 0.50       # 普通探索观察位置的最小水平距离。跨层使用到达容差加 PCT 格宽。
    observation_goal_xy_tolerance: 0.15  # 最终观察路点显式传给 SCAN；中间路点保留默认容差。
    failed_frontier_cooldown: 45.0       # 失败目标附近暂不重选的时长，单位秒。
    pct_candidate_round_budget: 1.0     # Yield between candidates after this search budget; no distance cutoff.
    low_yield_retry_cooldown: 8.0        # 低观测收益目标刚到达后的短暂冷却；无高收益目标时可重选其他低收益目标。
    no_frontier_hold: 8.0                # 区域探索完成的等待时间。PCT 按楼层探索时，清空队列后直接找楼梯。
    recovery_min_new_cells: 8            # 到达后新增观测低于该数量时按低收益目标处理。
    planner_occupancy_timeout: 2.0       # SCAN 障碍点云的有效时长，单位秒。
    planner_occupancy_height_tolerance: 0.5 # 只考虑与机体高度差不超过此值的障碍。
    observation_only: true               # true 只计算和显示，不发送运动目标。
    # Position arrival starts a yaw alignment / observation task. Seconds use wall time.
    observation_frame_wait: 2.0          # 定向补扫和跨层单侧等待相关回波的上限，单位秒。
    observation_flat_frame_wait: 1.0     # 普通观察点每个视角的等待时间，单位秒。
    observation_task_timeout: 60.0
    observation_sweep_half_angle: 0.35
    observation_full_sweep_fallback: false
    pct_query_budget_seconds: 0.20      # Per-batch compute slice; total budgets remain 2s/4s.
    pct_query_resume_delay_seconds: 0.10 # Release map locks between unfinished batches.
    pct_floor_view_budget_seconds: 2.0 # Cumulative search time for an ordinary cluster attempt.
    pct_floor_review_view_budget_seconds: 4.0 # General review ceiling. Bounded ordinary review caps this at 1 second.
    pct_floor_review_query_budget_seconds: 0.40 # General map read slice. Bounded ordinary review caps this at 0.20 seconds.
    pct_floor_review_wait_budget_seconds: 8.0 # Cumulative wall wait per floor, excluding execution and observation.
